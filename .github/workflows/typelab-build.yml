name: TypeLab Build APK
on: push
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: typelab-fire7-v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p typelab-fire7/app/src/main/assets
          cp typelab-fire7/index.html typelab-fire7/app/src/main/assets/index.html
          gradle -p typelab-fire7 :app:assembleDebug
          cp typelab-fire7/app/build/outputs/apk/debug/app-debug.apk TYPELAB_Fire7_v1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify TYPELAB_Fire7_v1.apk
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: typelab-fire7-v1
          file_pattern: TYPELAB_Fire7_v1.apk
          commit_message: 'TYPELAB APK build output'
      - uses: actions/upload-artifact@v4
        with:
          name: TYPELAB-v1-APK
          path: TYPELAB_Fire7_v1.apk
