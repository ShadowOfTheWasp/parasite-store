name: Build Parasite Home APK
on:
  push:
    paths: ['parasite-os/**', '.github/workflows/parasite-home-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: parasite-os
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp parasite-os/app/build/outputs/apk/debug/app-debug.apk parasite-home-v5.apk
          if gh release view parasite-home-v5 >/dev/null 2>&1; then
            gh release upload parasite-home-v5 parasite-home-v5.apk --clobber
          else
            gh release create parasite-home-v5 parasite-home-v5.apk --title "Parasite Home V5" --notes "Experimental reversible Fire OS home application. Amazon firmware remains installed."
          fi
