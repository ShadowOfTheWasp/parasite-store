name: MARKUP Fire 7 installable APK
on:
  push:
    branches: [markup-fire7-v1]
    paths: ['markup-fire7/**', '.github/workflows/markup-fire7-publish.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: markup-fire7-v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p markup-fire7/app/src/main/assets
          cp markup-fire7/index.html markup-fire7/app/src/main/assets/index.html
          gradle -p markup-fire7 :app:assembleDebug
          cp markup-fire7/app/build/outputs/apk/debug/app-debug.apk MARKUP_Fire7_v1.apk
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          branch: markup-fire7-v1
          file_pattern: MARKUP_Fire7_v1.apk
          commit_message: 'Publish MARKUP Fire7 installable APK'
      - uses: actions/upload-artifact@v4
        with:
          name: MARKUP-Fire7-v1
          path: MARKUP_Fire7_v1.apk
