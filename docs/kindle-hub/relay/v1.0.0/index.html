<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1210">
<title>Relay · Parasite</title>
<style>
:root{color-scheme:dark;--bg:#0d1210;--surface:#151e19;--border:#37483e;--ink:#edf2e9;--muted:#a7b8ab;--green:#caeb9e;--amber:#f1cd88}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}main{width:min(100% - 32px,960px);margin:auto;padding:20px 0 calc(28px + env(safe-area-inset-bottom))}
header,.bar,.controls,.compose,.entry-head{display:flex;align-items:center;gap:10px}header,.bar{justify-content:space-between}header{border-bottom:1px solid var(--border);padding-bottom:12px}a{color:var(--green);text-decoration:none;font-weight:700}
.tag,.entry-head,.count,label{font:700 12px/1.5 ui-monospace,monospace;letter-spacing:.035em}.tag,label,.count{color:var(--muted)}.hero{padding:22px 0 15px}h1{font-size:clamp(48px,12vw,88px);letter-spacing:-.08em;line-height:1;margin:0 0 9px}h2{font-size:19px;margin:0}p{margin:0;color:var(--muted)}.controls,.bar{flex-wrap:wrap}.surface{border:1px solid var(--border);background:var(--surface);border-radius:16px;padding:16px}.voice{margin-bottom:14px}.voice .controls{margin:11px 0 7px}.voice p{font-size:13px}
button,select,input{font:inherit;min-height:44px;border:1px solid var(--border);border-radius:8px;background:#101813;color:var(--ink);padding:8px 11px}button{font-weight:720;cursor:pointer}button:disabled{opacity:.52;cursor:default}button.primary{background:var(--green);border-color:var(--green);color:#16210e}button[data-live="true"]{background:#efac9c;border-color:#efac9c;color:#281512}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:14px}.log{min-width:0}.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0 10px;padding:3px;scrollbar-width:thin}.tabs button{flex:none;padding-inline:12px}.tabs [aria-pressed="true"]{background:#283a2b;border-color:var(--green);color:var(--green)}.feed{height:clamp(220px,37vh,440px);overflow:auto;overscroll-behavior:contain;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:10px}.entry{padding:10px 10px 11px;border-bottom:1px solid var(--border);border-inline-start:3px solid var(--channel)}.entry[data-hit]{background:#302919}.entry p{color:var(--ink);overflow-wrap:anywhere}.entry-head{flex-wrap:wrap;color:var(--muted);margin-bottom:3px}.entry-head strong{color:var(--channel)}.hit{color:var(--amber)}.empty{padding:17px 9px}.compose input{min-width:0;flex:1}.compose{margin-top:6px}.rail{display:grid;align-content:start;gap:14px}.rail h2{margin-bottom:8px}.rail input{width:100%;margin:7px 0 8px}.rail p{font-size:13px}.rail button{width:100%}.actions{display:grid;gap:8px}.live{color:var(--green)}.problem{color:var(--amber)}.partial{margin:0 0 10px;overflow-wrap:anywhere}
@media(max-width:680px){.workspace{grid-template-columns:1fr}.rail{grid-template-columns:1fr 1fr}.hero{padding:17px 0 13px}.surface{padding:12px}.voice .controls{gap:7px}}
@media(max-width:370px){main{width:calc(100% - 20px)}.rail{grid-template-columns:1fr}.tag{font-size:11px}}
</style>
</head>
<body>
<main>
<header><a href="../../../">‹ Parasite Hub</a><span class="tag">COMMS / V1.0</span></header>
<div class="hero"><h1>Relay</h1><p>Read talkback, log mix requests and spot cues.</p></div>
<section class="surface voice" aria-labelledby="voice-title">
  <div class="bar"><h2 id="voice-title">Talkback input</h2><span id="voice-status" class="tag" role="status">Mic off</span></div>
  <div class="controls">
    <label for="channel">Channel</label>
    <select id="channel"><option>Monitors</option><option>Stage</option><option>FOH</option><option>Show call</option></select>
    <label for="language">Language</label>
    <select id="language"><option value="en-GB">English (UK)</option><option value="en-US">English (US)</option><option value="fr-FR">Français</option><option value="de-DE">Deutsch</option><option value="es-ES">Español</option><option value="nl-NL">Nederlands</option></select>
    <button class="primary" id="mic" type="button">Start mic</button>
  </div>
  <p>Voice uses your browser’s speech service, which may process audio online. Export the log before closing this page.</p>
</section>
<div class="workspace">
  <section class="surface log" aria-labelledby="log-title">
    <div class="bar"><h2 id="log-title">Show log</h2><span class="count" id="count">0 entries</span></div>
    <div class="tabs" id="filters" role="group" aria-label="Filter show log"></div>
    <div class="feed" id="feed" role="log" aria-label="Transcript" aria-live="off" tabindex="0"></div>
    <p id="partial" class="partial" hidden></p>
    <form id="composer">
      <label id="entry-label" for="message">Type to Monitors</label>
      <div class="compose"><input id="message" placeholder="Mix request or show note" maxlength="500" required><button class="primary">Add</button></div>
    </form>
  </section>
  <aside class="rail" aria-label="Show log tools">
    <form id="cue-form" class="surface">
      <h2>Keyword alerts</h2><p>Highlight matching entries.</p>
      <label for="cues">Phrases, comma separated</label>
      <input id="cues" value="stand by, hold, show stop" maxlength="300">
      <button>Save phrases</button>
      <p id="alerts" role="status">0 matches</p>
    </form>
    <section class="surface actions" aria-label="Log actions">
      <button id="demo" type="button">Load demo cues</button>
      <button id="export" type="button" disabled>Export CSV</button>
      <button id="clear" type="button" disabled>Clear log</button>
    </section>
  </aside>
</div>
</main>
<script src="./relay.js" defer></script>
</body>
</html>
