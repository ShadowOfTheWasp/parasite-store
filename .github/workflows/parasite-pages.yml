name: Publish PARASITE Store and Launcher
on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - 'chaz/**'
      - 'parasite-os/**'
      - 'microverse/**'
      - 'melt/**'
      - 'orbit/**'
      - 'tapeflute/**'
      - 'twig/**'
      - 'jasper/**'
      - 'afterbeat/**'
      - 'docs/**'
      - '.github/workflows/parasite-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: parasite-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build Chaz v1.0.0
        working-directory: chaz
        run: gradle --no-daemon assembleDebug
      - name: Build Parasite Home
        working-directory: parasite-os
        run: gradle --no-daemon assembleDebug
      - name: Build Parasite Launcher
        working-directory: launcher
        run: gradle --no-daemon assembleDebug
      - name: Build Microverse V5
        working-directory: microverse
        run: gradle --no-daemon assembleDebug
      - name: Build MELT 003
        working-directory: melt
        run: gradle --no-daemon assembleDebug
      - name: Build Orbit v4.1.0
        working-directory: orbit
        run: gradle --no-daemon assembleDebug
      - name: Build Tron v4.0.0
        working-directory: tapeflute
        run: gradle --no-daemon assembleDebug
      - name: Build TWIG v1.0.0
        working-directory: twig
        run: gradle --no-daemon assembleDebug
      - name: Build AFTERBEAT v1.0.0
        working-directory: afterbeat
        run: gradle --no-daemon assembleDebug
      - name: Build JASPER v1.0.0
        working-directory: jasper
        run: gradle --no-daemon assembleDebug
      - name: Prepare public installer files
        run: |
          set -euo pipefail
          test -s launcher/app/build/outputs/apk/debug/app-debug.apk
          cp launcher/app/build/outputs/apk/debug/app-debug.apk docs/parasite-launcher.apk
          test -s microverse/app/build/outputs/apk/debug/app-debug.apk
          cp microverse/app/build/outputs/apk/debug/app-debug.apk docs/parasite-microverse.apk
          test -s melt/app/build/outputs/apk/debug/app-debug.apk
          cp melt/app/build/outputs/apk/debug/app-debug.apk docs/parasite-melt.apk
          cp melt/app/build/outputs/apk/debug/app-debug.apk docs/parasite-melt-v3.6.0.apk
          unzip -p docs/parasite-melt-v3.6.0.apk assets/index.html | cmp - docs/melt/web/v3.6.0/index.html
          cp parasite-os/app/build/outputs/apk/debug/app-debug.apk docs/parasite-home-v9.1.0.apk
          for file in index.html icon.svg manifest.webmanifest orbit/v4.1.0/{index.html,samples.js,space-echo.js,SOURCES.md,LICENSE-SAMPLES.txt} bounce/v3.6.0/index.html slice/v1.0.0/{index.html,splice.css,splice.js,h910.js}; do
            unzip -p docs/parasite-home-v9.1.0.apk "assets/hub/$file" | cmp - "docs/kindle-hub/$file"
          done
          python3 - <<'PYMETA'
          import json, os
          from datetime import datetime, timezone
          with open('docs/release.json','w') as f:
              json.dump({'version':10,'versionName':'9.1.0','state':'ready','apk':'parasite-home-v9.1.0.apk','commit':os.environ['GITHUB_SHA'],'builtAt':datetime.now(timezone.utc).isoformat()},f)
          PYMETA
          test -s orbit/app/build/outputs/apk/debug/app-debug.apk
          cp orbit/app/build/outputs/apk/debug/app-debug.apk docs/parasite-orbit-v4.1.0.apk
          for file in index.html samples.js space-echo.js SOURCES.md LICENSE-SAMPLES.txt; do
            unzip -p docs/parasite-orbit-v4.1.0.apk "assets/$file" | cmp - "docs/orbit/v4.1.0/$file"
          done
          test -s tapeflute/app/build/outputs/apk/debug/app-debug.apk
          cp tapeflute/app/build/outputs/apk/debug/app-debug.apk docs/parasite-tron-v4.0.0.apk
          for file in index.html samples.js SOURCES.md; do
            unzip -p docs/parasite-tron-v4.0.0.apk "assets/$file" | cmp - "docs/tron/v4.0.0/$file"
          done
          test -s twig/app/build/outputs/apk/debug/app-debug.apk
          cp twig/app/build/outputs/apk/debug/app-debug.apk docs/parasite-twig-v1.0.0.apk
          unzip -p docs/parasite-twig-v1.0.0.apk assets/index.html | cmp - docs/twig/v1.0.0/index.html
          unzip -p docs/parasite-twig-v1.0.0.apk assets/twig.js | cmp - docs/twig/v1.0.0/twig.js
          test -s afterbeat/app/build/outputs/apk/debug/app-debug.apk
          cp afterbeat/app/build/outputs/apk/debug/app-debug.apk docs/parasite-afterbeat-v1.0.0.apk
          for file in index.html panel.css panel.js drums.js; do
            unzip -p docs/parasite-afterbeat-v1.0.0.apk "assets/$file" | cmp - "docs/afterbeat/v1.0.0/$file"
          done
          test -s jasper/app/build/outputs/apk/debug/app-debug.apk
          cp jasper/app/build/outputs/apk/debug/app-debug.apk docs/parasite-jasper-v1.0.0.apk
          for file in index.html jasper.js; do
            unzip -p docs/parasite-jasper-v1.0.0.apk "assets/$file" | cmp - "docs/jasper/v1.0.0/$file"
          done
          cp chaz/app/build/outputs/apk/debug/app-debug.apk docs/parasite-chaz-v1.0.0.apk
          for file in index.html style.css app.js engine.js h910.js space-echo.js; do
            unzip -p docs/parasite-chaz-v1.0.0.apk "assets/$file" | cmp - "docs/chaz/v1.0.0/$file"
          done
          touch docs/.nojekyll
          sha256sum docs/*.apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Allow uploaded Pages artifact to become available
        run: sleep 18
      - name: Give GitHub Pages time to index the uploaded artifact
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
