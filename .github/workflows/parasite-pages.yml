name: Publish PARASITE Store and Launcher
on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - 'microverse/**'
      - 'melt/**'
      - 'tapeflute/**'
      - 'docs/**'
      - '.github/workflows/parasite-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: parasite-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build Parasite Launcher
        working-directory: launcher
        run: gradle --no-daemon assembleDebug
      - name: Build Microverse V5
        working-directory: microverse
        run: gradle --no-daemon assembleDebug
      - name: Build MELT 003
        working-directory: melt
        run: gradle --no-daemon assembleDebug
      - name: Build Tape Flute v1.1.0
        working-directory: tapeflute
        run: gradle --no-daemon assembleDebug
      - name: Prepare public installer files
        run: |
          set -euo pipefail
          test -s launcher/app/build/outputs/apk/debug/app-debug.apk
          cp launcher/app/build/outputs/apk/debug/app-debug.apk docs/parasite-launcher.apk
          test -s microverse/app/build/outputs/apk/debug/app-debug.apk
          cp microverse/app/build/outputs/apk/debug/app-debug.apk docs/parasite-microverse.apk
          test -s melt/app/build/outputs/apk/debug/app-debug.apk
          cp melt/app/build/outputs/apk/debug/app-debug.apk docs/parasite-melt.apk
          printf '{"version":8,"state":"ready","apk":"parasite-launcher.apk"}\n' > docs/release.json
          test -s tapeflute/app/build/outputs/apk/debug/app-debug.apk
          cp tapeflute/app/build/outputs/apk/debug/app-debug.apk docs/parasite-tape-flute-v1.1.0.apk
          unzip -p docs/parasite-tape-flute-v1.1.0.apk assets/index.html | cmp - docs/tape-flute/v1.1.0/index.html
          unzip -p docs/parasite-tape-flute-v1.1.0.apk assets/effects.js | cmp - docs/tape-flute/v1.1.0/effects.js
          touch docs/.nojekyll
          sha256sum docs/*.apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Allow uploaded Pages artifact to become available
        run: sleep 18
      - name: Give GitHub Pages time to index the uploaded artifact
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
