<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c100d">
<meta name="apple-mobile-web-app-title" content="Parasite Creator">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
<title>Parasite Creator</title>
</head>
<body>
<main>
  <header><strong>PARASITE<span>_</span></strong><button id="lock" type="button" class="quiet" hidden>Lock</button></header>
  <h1>New module<span>.</span></h1>
  <p class="intro">Describe an instrument or a change to an existing module.</p>
  <section id="setup" hidden>
    <form id="unlock">
      <label for="code">Creator access code</label>
      <input id="code" required type="password" autocomplete="current-password" autocapitalize="characters" maxlength="90">
      <button class="primary" type="submit">Unlock Creator</button>
    </form>
  </section>
  <div id="workspace" hidden>
    <form id="brief-form">
      <label for="brief">Your brief</label>
      <textarea id="brief" rows="6" minlength="10" maxlength="4000" required placeholder="Make a four-track tape looper. Each track needs reverse and half speed…"></textarea>
      <div class="draft-line"><span id="draft">Draft stays on this device</span><output id="count" for="brief">0 / 4,000</output></div>
      <button id="submit" class="primary" type="submit">Queue module</button>
    </form>
    <section class="requests" aria-labelledby="requests-label">
      <div class="requests-head"><h2 id="requests-label">Requests</h2><button type="button" id="refresh" class="quiet">Refresh</button></div>
      <div id="history"></div>
    </section>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <footer><a href="https://shadowofthewasp.github.io/parasite-store/">Infect Your Kindle ↗</a></footer>
</main>
</body>
</html>
