<!doctype html>
<!-- PARASITE V2.1 / UNIVERSAL SPECTRUM MODULE STARTER — copy into each newly invented module.
     Replace only the marked performance surface and DSP hooks. Never put secrets here.
     This is a developer template, not an additional deployed instrument. -->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060c0b">
<title>Parasite / New Instrument</title>
<link rel="stylesheet" href="/parasite-v2.css">
<style>
:root{--p2-accent:#c6ff91;--p2-spectrum:linear-gradient(90deg,#c6ff91,#f6d18b,#85e4f9,#c4a8f7)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation}
.p2-machine{height:100dvh;min-height:0;display:grid;grid-template-rows:54px minmax(0,1fr) 25px;gap:8px;padding:max(6px,env(safe-area-inset-top)) 10px max(7px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at 85% 8%,#1a3c35 0,transparent 48%),#060c0b}
.p2-header{display:flex;gap:16px;align-items:center;justify-content:space-between;min-height:0}
.p2-name{font-size:clamp(24px,3vw,37px);font-weight:800;letter-spacing:-2px;color:var(--p2-glow);line-height:1}
.p2-kicker{font-size:9px;letter-spacing:2px;color:#b6d4c0}
.p2-workspace{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(240px,.75fr);gap:8px;min-height:0}
.p2-surface,.p2-controls{border:1px solid #52755f;border-radius:17px;background:linear-gradient(145deg,#1a352b,#0d211c);box-shadow:inset 0 1px 0 #eaffd51f;padding:14px;min-height:0;overflow:hidden}
.p2-surface{display:flex;flex-direction:column}.p2-controls{display:flex;flex-direction:column;gap:8px}
.p2-title{font-size:10px;letter-spacing:1.8px;color:var(--p2-mint);font-weight:800}
.p2-playfield{flex:1;min-height:0;display:grid;place-items:center}
.p2-control-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,1.4fr);gap:12px;align-items:center;font-size:11px;color:#c6dfc4;padding:8px 0;border-bottom:1px solid #48604d55}
.p2-control-row input{width:100%;accent-color:var(--p2-glow)}
.p2-secondary{border:1px solid #527660;border-radius:9px;background:#142c24;padding:10px;color:#daf0d6}
.p2-secondary summary{font-weight:750;cursor:pointer;font-size:11px}
.p2-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:9px;letter-spacing:1px;color:#a9c5ac}
.p2-footer span:last-child{color:#b9ff96}
@media(max-width:720px){.p2-workspace{grid-template-columns:1fr;grid-template-rows:minmax(0,1.5fr) minmax(0,.7fr)}.p2-controls{padding:8px;gap:4px}.p2-control-row{padding:2px 0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head>
<body class="parasite-v2-module" data-p2-module="custom">
<main class="p2-machine">
<header class="p2-header"><div><div class="p2-kicker">PARASITE / INSTRUMENT LABORATORY</div><div class="p2-name" id="instrumentName">new instrument</div></div><div class="p2-kicker">NOCTURNE · SPECTRUM V2</div></header>
<section class="p2-workspace">
<section class="p2-surface" aria-label="Performance surface"><div class="p2-title">PERFORMANCE</div><div class="p2-playfield" id="performance"><!-- REQUIRED: insert working instrument-specific interactive surface, not a screenshot. --></div></section>
<aside class="p2-controls" aria-label="Sound controls"><div class="p2-title">SOUND SHAPING</div>
<label class="p2-control-row"><span>MASTER OUTPUT</span><input type="range" min="0" max="1" value=".65" step=".01" id="masterOutput" aria-label="Master output gain"></label>
<details class="p2-secondary"><summary>ADVANCED PARAMETERS</summary><div id="advanced"><!-- Additional DSP controls, one tap away --></div></details>
<details class="p2-secondary"><summary>EFFECTS / ROUTING</summary><div id="effects"><!-- Additional effect controls, one tap away --></div></details>
</aside></section>
<footer class="p2-footer"><span>PARASITE / NOCTURNE SYSTEM</span><span role="status" id="engineStatus">AWAITING AUDIO ENGINE</span></footer>
</main>
<script src="/parasite-v2.js"></script>
<script>window.ParasiteV2?.apply(document,'custom')</script>
<!-- Instrument DSP script and specific preset bridge must load BEFORE preset-bank.js. -->
<script src="/preset-bank.js"></script>
</body></html>
