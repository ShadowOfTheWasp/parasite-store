name: Build Parasite Home APK
on:
  push:
    paths: ['parasite-os/**', '.github/workflows/parasite-home-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - name: Build
        working-directory: parasite-os
        run: gradle :app:assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp parasite-os/app/build/outputs/apk/debug/app-debug.apk parasite-home-v1.apk
          gh release delete parasite-home-v1 --yes || true
          gh release create parasite-home-v1 parasite-home-v1.apk --title 'Parasite Home V1' --notes 'Experimental, reversible Fire 7 home application. Fire OS remains installed.'
