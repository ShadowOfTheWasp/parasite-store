name: Parasite V3 release integrity
on:
  push:
    paths:
      - 'ipad-kindle-parity/**'
      - '.github/workflows/parasite-v3-release-integrity.yml'
  pull_request:
    paths:
      - 'ipad-kindle-parity/**'
      - '.github/workflows/parasite-v3-release-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Hub and all published instruments
        run: node ipad-kindle-parity/tests/release-static.cjs
